<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120a2a">
<meta name="description" content="Nebulosa Roja: arcade espacial con Eco Temporal. Jugable sin internet e instalable como app.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nebulosa Roja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Nebulosa Roja — Naves vs Aliens</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="Campo de juego"></canvas>
  <div id="hud" class="hidden">
    <div class="hud-l"><div id="score">0</div><div id="lives" aria-label="Vidas"></div><div id="combo"></div></div>
    <div class="hud-r"><div id="lvl">Sector 1 · 1/3</div><div id="coins">0</div><button id="pauseBtn" aria-label="Pausar">❚❚</button></div>
  </div>
  <div id="pw" class="hidden"></div>
  <div id="tip" class="hidden"></div>
  <div id="banner"><b></b><span></span></div>
  <div id="btns" class="hidden">
    <button id="bombBtn" class="rbtn bomb" aria-label="Bomba"><i>💥</i><span id="bombN">1</span></button>
    <button id="ecoBtn" class="rbtn eco" aria-label="Eco Temporal"><i>◔</i><em>ECO</em></button>
  </div>
  <div id="ecoBar" class="hidden"><div id="ecoFill"></div></div>
  <div id="screens"><div class="screen center"><h1 class="logo"><span>NEBULOSA</span><b>ROJA</b><i></i></h1><p class="dim">Cargando…</p></div></div>
  <noscript><div class="screen center"><p>Este juego necesita JavaScript.</p></div></noscript>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
